<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NexusShop — Pakistan's COD-first marketplace</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://esm.sh/@supabase/supabase-js@2"></script>
<script>
tailwind.config={darkMode:'media',theme:{extend:{colors:{nx:{50:'#e8f7ee',100:'#c9ecd8',300:'#a3ddb9',500:'#00A650',600:'#008a42',700:'#006d34',900:'#003d1e',yel:'#FFE600',pink:'#EC4899',blue:'#3483FA'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],ur:['Noto Nastaliq Urdu','serif']}}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>
.ur,.ur *{font-family:'Noto Nastaliq Urdu',serif!important;line-height:2.1}
@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes slideIn{from{transform:translateY(-20px);opacity:0}to{transform:translateY(0);opacity:1}}
.toast{animation:slideIn .3s ease both}
</style>
</head>
<body class="bg-zinc-100 dark:bg-[#0b1512] text-zinc-900 dark:text-zinc-100 font-sans pb-20">

<div id="splash" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-center px-6 bg-gradient-to-b from-nx-500 via-nx-600 to-nx-700 dark:from-[#0b1512] dark:to-[#12281c]">
<div class="w-24 h-24 rounded-3xl bg-white shadow-2xl flex items-center justify-center text-5xl animate-[pop_.7s_cubic-bezier(.2,.8,.2,1)_both]">🛒</div>
<h1 class="mt-5 text-3xl font-extrabold text-white animate-[up_.6s_.15s_both]">NexusShop</h1>
<p class="mt-3 text-nx-50 animate-[up_.6s_.25s_both]">Your store. Your country. Your income.<br><span class="ur">آپ کی دکان۔ آپ کا ملک۔ آپ کی کمائی۔</span></p>
<div class="mt-5 flex gap-3 animate-[up_.6s_.35s_both]">
<button onclick="setL('en')" class="px-5 py-2 rounded-full bg-white/15 text-white font-bold">English</button>
<button onclick="setL('ur')" class="px-5 py-2 rounded-full bg-white/15 text-white font-bold ur">اردو</button>
</div>
<button onclick="enterShop()" id="sp-enter" class="mt-7 w-full max-w-sm py-4 rounded-2xl bg-white text-nx-700 font-extrabold shadow-lg animate-[up_.6s_.45s_both]">Enter · <span class="ur">داخل کریں</span></button>
</div>

<header class="sticky top-0 z-40 bg-nx-600 dark:bg-[#12281c] text-white shadow">
<div class="max-w-5xl mx-auto flex items-center gap-3 px-4 py-3">
<span class="text-xl">🛒</span><span class="font-extrabold text-lg">NexusShop</span>
<span class="flex-1"></span>
<button onclick="setL(LAN==='ur'?'en':'ur')" id="langbtn" class="px-3 py-1 rounded-full bg-white/15 font-bold text-sm">اردو</button>
<button onclick="location.hash='#/wish'" class="px-3 py-1 rounded-full bg-white/15 text-sm">♥</button>
<button onclick="location.hash='#/cart'" class="relative px-3 py-1 rounded-full bg-white/15 text-sm">🛒<span id="badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-nx-pink text-white text-[10px] font-bold items-center justify-center" style="display:none">0</span></button>
<button onclick="userAction()" id="userbtn" class="px-3 py-1 rounded-full bg-white/15 text-sm">👤</button>
</div>
</header>

<main id="view" class="max-w-5xl mx-auto px-4"></main>

<footer class="max-w-5xl mx-auto px-4 py-6 mt-8 border-t border-zinc-200 dark:border-zinc-800 text-center text-xs text-zinc-500">
<div class="flex flex-wrap justify-center gap-4 mb-3">
<a href="mailto:neuralfocusia@gmail.com" class="hover:text-nx-500">✉ Contact</a>
</div>
<p>© 2026 NexusShop</p>
</footer>

<nav class="fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-[#12281c] border-t border-zinc-200 dark:border-zinc-800 pb-[env(safe-area-inset-bottom)]">
<div class="max-w-5xl mx-auto grid grid-cols-5 text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">
<button onclick="location.hash='#/'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🏠</span><span id="nv-home">Home</span></button>
<button onclick="location.hash='#/wish'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">♥</span><span id="nv-wish">Wishlist</span></button>
<button onclick="location.hash='#/cart'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🛒</span><span id="nv-cart">Cart</span></button>
<button onclick="location.hash='#/orders'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">📦</span><span id="nv-ord">Orders</span></button>
<button onclick="location.hash='#/seller'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🏪</span><span id="nv-sell">Sell</span></button>
</div>
</nav>

<div id="toast-container" class="fixed top-20 left-1/2 -translate-x-1/2 z-50 space-y-2"></div>

<script>
/* ===== CORE LÓGICO: script clásico, funciona SIN internet ===== */
const SUPA_URL='https://iafofzwxkzwliisvstfy.supabase.co';
const SUPA_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlhZm9mend4a3p3bGlpc3ZzdGZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk4ODg4NzAsImV4cCI6MjEwNTQ2NDg3MH0.azD-XVPjQ1COT8_bnk1mdTo51dalR4FyzC-Qs4tEp8o';
const SB=supabase.createClient(SUPA_URL,SUPA_KEY);

var LAN=localStorage.getItem('nx2_lang')||'en';
var USER=null;
var T={en:{home:'Home',wish:'Wishlist',cart:'Cart',orders:'Orders',sell:'Sell',search:'Search in NexusShop',add:'Add',buy:'Order on WhatsApp',qty:'Quantity',details:'Details',sold:'sold',delivery:'Free delivery tomorrow',cod:'Cash on Delivery',ret:'7-day returns',total:'Total',empty:'Your cart is empty',checkout:'Checkout',coming:'Coming soon',login:'Log in',signup:'Sign up',email:'Email',pass:'Password',logout:'Log out',reviews:'Reviews',wrev:'Write review',send:'Send',stock:'in stock',shop:'Shop',create:'Create shop',addprod:'Add product',myprods:'My products',myords:'My orders',stats:'Stats',pending:'Pending',confirmed:'Confirmed',shipped:'Shipped',delivered:'Delivered',cancelled:'Cancelled',cancel:'Cancel order',dispute:'Open dispute',coupon:'Coupon code',apply:'Apply',sub:'Subtotal',disc:'Discount',all:'All categories',noProds:'No products yet'},
ur:{home:'ہوم',wish:'پسندیدہ',cart:'کارٹ',orders:'آرڈرز',sell:'بیچیں',search:'NexusShop میں تلاش',add:'شامل کریں',buy:'واٹس ایپ پر آرڈر',qty:'تعداد',details:'تفصیل',sold:'فروخت شدہ',delivery:'کل مفت ڈیلیوری',cod:'کیش آن ڈیلیوری',ret:'7 دن واپسی',total:'کل',empty:'آپ کا کارٹ خالی ہے',checkout:'چیک آؤٹ',coming:'جلد آرہا ہے',login:'لاگ ان',signup:'سائن اپ',email:'ای میل',pass:'پاس ورڈ',logout:'لاگ آؤٹ',reviews:'جائزے',wrev:'جائزہ لکھیں',send:'بھیجیں',stock:'اسٹاک میں',shop:'دکان',create:'دکان بنائیں',addprod:'پروڈکٹ شامل کریں',myprods:'میری مصنوعات',myords:'میرے آرڈرز',stats:'اعداد و شمار',pending:'زیر التوا',confirmed:'تصدیق شدہ',shipped:'بھیج دیا',delivered:'پہنچا دیا',cancelled:'منسوخ',cancel:'آرڈر منسوخ',dispute:'جھگڑا کھولیں',coupon:'کوپن کوڈ',apply:'لاگو کریں',sub:'ذیلی کل',disc:'رعایت',all:'تمام کیٹیگریز',noProds:'ابھی کوئی پروڈکٹ نہیں'}};

function t(k){return (T[LAN]&&T[LAN][k])||T.en[k]||k;}
function setL(l){LAN=l;localStorage.setItem('nx2_lang',l);applyL();render();}
function applyL(){document.documentElement.dir=(LAN==='ur')?'rtl':'ltr';document.documentElement.lang=LAN;document.body.classList.toggle('ur',LAN==='ur');var lb=document.getElementById('langbtn');if(lb)lb.textContent=(LAN==='ur'?'EN':'اردو');var nv=[['nv-home','home'],['nv-wish','wish'],['nv-cart','cart'],['nv-ord','orders'],['nv-sell','sell']];for(var i=0;i<nv.length;i++){var e=document.getElementById(nv[i][0]);if(e)e.textContent=t(nv[i][1]);}}
function enterShop(){sessionStorage.setItem('nx2_in','1');var s=document.getElementById('splash');if(s)s.style.display='none';render();}
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m,type){
  var container=document.getElementById('toast-container');
  if(!container)return;
  var el=document.createElement('div');
  el.className='toast px-4 py-3 rounded-xl shadow-lg font-semibold text-sm flex items-center gap-2 '+(type==='error'?'bg-red-500 text-white':type==='success'?'bg-green-500 text-white':'bg-zinc-900 text-white');
  el.innerHTML=(type==='success'?'✓ ':type==='error'?'✗ ':'ℹ ')+esc(m);
  container.appendChild(el);
  setTimeout(()=>{el.style.opacity='0';setTimeout(()=>el.remove(),300);},2500);
}

async function session(){const{data}=await SB.auth.getSession();USER=data.session?.user||null;document.getElementById('userbtn').textContent=USER?'✅':'👤';}
SB.auth.onAuthStateChange(()=>{session();render();});

function userAction(){if(USER){SB.auth.signOut();toast('Logged out','success');}else{location.hash='#/login';}}

var DB={prods:[],cats:[],shops:[]};

async function loadDB(){
  try{
    const{data:cats}=await SB.from('ns_categories').select('*');
    const{data:prods}=await SB.from('ns_products').select('*,ns_shops(name,whatsapp)').eq('status','active').order('created_at',{ascending:false}).limit(60);
    DB.cats=cats||[];
    DB.prods=prods||[];
    render();
  }catch(e){
    DB.cats=[];
    DB.prods=[];
    render();
  }
}

function P(i){return DB.prods.find(p=>p.id===i);}
function nm(p){return LAN==='ur'&&p.title_ur?p.title_ur:p.title_en;}
function pr(p){return (p.price_cents||0)/100;}
function old(p){return (p.old_price_cents||0)/100;}
function em(p){return p.image_url||'🛍️';}
function wa(p){return p.ns_shops?.whatsapp||'923000000000';}

function cart(){try{return JSON.parse(localStorage.getItem('nx2_cart')||'[]');}catch(e){return[];}}
function saveCart(c){localStorage.setItem('nx2_cart',JSON.stringify(c));badge();}
function badge(){var c=cart(),n=0;for(var i=0;i<c.length;i++)n+=c[i].q;var e=document.getElementById('badge');if(!e)return;e.textContent=n;e.style.display=(n>0)?'flex':'none';}

function add(i,q){if(!USER){location.hash='#/login';return;}var c=cart(),f=null;for(var k=0;k<c.length;k++){if(c[k].i===i)f=c[k];}if(f){f.q+=(q||1);}else{var p=P(i);c.push({i:i,q:(q||1),title:p.title_en,title_ur:p.title_ur,price:p.price_cents,image:p.image_url,shop:p.ns_shops});}saveCart(c);toast('✓ '+t('add'),'success');}
function setQ(i,d){var c=cart();for(var k=0;k<c.length;k++){if(c[k].i===i){c[k].q+=d;if(c[k].q<1)c.splice(k,1);}}saveCart(c);render();}

function waLink(p){var msg=(LAN==='ur')?('السلام علیکم! مجھے اس پروڈکٹ میں دلچسپی ہے: '+nm(p)+' ('+money(pr(p))+') — NexusShop'):('Hi! I\'m interested in '+nm(p)+' ('+money(pr(p))+') from NexusShop. Is it available?');return 'https://wa.me/'+wa(p)+'?text='+encodeURIComponent(msg);}
function stars(r){var n=Math.round(r||0),s='';for(var i=1;i<=5;i++)s+=(i<=n?'★':'☆');return '<span class="text-nx-yel text-sm">'+s+'</span>';}

function card(p,i){var d=p.old_price_cents?Math.round((1-p.price_cents/p.old_price_cents)*100):0;return '<div onclick="location.hash=\'#/p/'+p.id+'\'" class="bg-white dark:bg-[#16241d] rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden cursor-pointer active:opacity-80"><div class="relative bg-zinc-50 dark:bg-[#1d2b24] h-32 flex items-center justify-center text-5xl"><img src="'+esc(em(p))+'" class="w-full h-full object-cover" onerror="this.style.display=\'none\';this.parentElement.innerHTML=\'🛍️\'" />'+
(d?'<span class="absolute top-2 left-2 bg-nx-pink text-white text-[10px] font-bold px-2 py-1 rounded-full">-'+d+'%</span>':'')+'</div><div class="p-3"><div class="text-sm font-semibold leading-snug line-clamp-2 min-h-[36px]">'+esc(nm(p))+'</div><div class="mt-1 text-nx-500 font-extrabold">'+money(pr(p))+'</div>'+(p.old_price_cents?'<div class="text-xs text-zinc-400 line-through">'+money(old(p))+'</div>':'')+'<div class="mt-1 text-xs text-zinc-500">'+(p.stock||0)+' '+t('stock')+'</div><div class="mt-2 flex items-center justify-between"><span class="text-[10px] font-semibold text-nx-600 dark:text-nx-300">'+t('delivery')+'</span><button onclick="event.stopPropagation();add(\''+p.id+'\',1)" class="bg-nx-500 text-white text-xs font-bold px-3 py-2 rounded-lg" '+(p.stock>0?'':'disabled')+'>+ '+t('add')+'</button></div></div></div>';}

function home(filter){var h='<div class="mt-4"><input placeholder="'+t('search')+'" class="w-full py-3 px-4 rounded-xl bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-nx-500" oninput="search(this.value)"></div>';
h+='<div class="mt-4 rounded-2xl bg-gradient-to-r from-nx-700 to-nx-500 text-white p-5"><div class="font-extrabold italic text-lg">FLASH SALE · NEXUS FEST −40%</div><div class="text-xs mt-1 opacity-90">'+(LAN==='ur'?'ختم ہونے میں':'Ends in')+'</div><div id="cd" class="mt-1 text-2xl font-extrabold tabular-nums bg-white/15 rounded-lg px-3 py-1 inline-block">--:--:--</div></div>';
h+='<div class="mt-4 flex gap-2 overflow-x-auto pb-2"><button class="chip px-4 py-2 rounded-full bg-nx-500 text-white text-sm font-bold" onclick="filterCat(\'\')">'+t('all')+'</button>';
DB.cats.forEach(c=>{h+='<button class="chip px-4 py-2 rounded-full bg-zinc-200 dark:bg-zinc-800 text-sm font-bold" onclick="filterCat('+c.id+')">'+esc(LAN==='ur'&&c.name_ur?c.name_ur:c.name_en)+'</button>';});
h+='</div>';
var list=DB.prods||[];if(filter==='offers'){list=list.filter(p=>p.old_price_cents>p.price_cents);}
h+='<div class="mt-5 grid grid-cols-2 gap-3" id="grid">';for(var i=0;i<list.length;i++)h+=card(list[i],i);h+='</div>';
if(!list.length)h+='<div class="text-center text-zinc-500 py-10">'+t('noProds')+'</div>';
return h;}

window.filterCat=function(cid){var g=document.getElementById('grid');if(!g)return;var list=cid?DB.prods.filter(p=>p.category_id===cid):DB.prods;g.innerHTML=list.map(card).join('')||'<div class="col-span-2 text-center text-zinc-500 py-10">No products</div>';};
window.search=function(v){var g=document.getElementById('grid');if(!g)return;v=(v||'').toLowerCase();var out='';for(var i=0;i<DB.prods.length;i++){var p=DB.prods[i];if(!v||nm(p).toLowerCase().indexOf(v)>=0||(p.title_en||'').toLowerCase().indexOf(v)>=0)out+=card(p,i);}g.innerHTML=out||'<div class="col-span-2 text-center text-zinc-500 py-10">No results</div>';};

async function detail(id){var p=P(id);if(!p)return home();var d=p.old_price_cents?Math.round((1-p.price_cents/p.old_price_cents)*100):0;
var revs=[];try{const{data}=await SB.from('ns_reviews').select('*').eq('product_id',id).order('created_at',{ascending:false});revs=data||[];}catch(e){}
var h='<div class="py-4">';
h+='<div class="bg-white dark:bg-[#16241d] rounded-2xl border border-zinc-200 dark:border-zinc-800 overflow-hidden"><img src="'+esc(em(p))+'" class="w-full h-64 object-cover" onerror="this.parentElement.innerHTML=\'<div class=\\\'h-64 flex items-center justify-center text-7xl\\\'>🛍️</div>\'" /></div>';
h+='<h1 class="mt-4 text-xl font-extrabold">'+esc(nm(p))+'</h1>';
h+='<div class="mt-1 text-sm text-zinc-500">'+t('shop')+': '+esc(p.ns_shops?.name||'')+'</div>';
h+='<div class="mt-2 text-2xl font-extrabold text-nx-500">'+money(pr(p))+(d?' <span class="align-middle text-xs font-bold bg-nx-pink text-white px-2 py-1 rounded-full">-'+d+'%</span>':'')+'</div>';
if(p.old_price_cents)h+='<div class="text-sm text-zinc-400 line-through">'+money(old(p))+'</div>';
h+='<div class="mt-3 flex flex-wrap gap-2"><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('cod')+'</span><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('delivery')+'</span><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('ret')+'</span></div>';
h+='<div class="mt-4 flex items-center gap-3"><span class="text-sm font-semibold">'+t('qty')+'</span><button onclick="dq(-1)" class="w-9 h-9 rounded-lg bg-nx-500 text-white font-extrabold">−</button><span id="dq" class="w-7 text-center font-extrabold">1</span><button onclick="dq(1)" class="w-9 h-9 rounded-lg bg-nx-500 text-white font-extrabold">+</button></div>';
h+='<div class="mt-5 flex gap-3"><a href="'+waLink(p)+'" target="_blank" rel="noopener" class="flex-[1.2] text-center py-3 rounded-xl bg-[#25D366] text-white font-extrabold">💬 '+t('buy')+'</a><button onclick="add(\''+id+'\',window._q||1)" class="flex-1 py-3 rounded-xl bg-nx-500 text-white font-extrabold">'+t('add')+' 🛒</button><button onclick="wish(\''+id+'\')" class="px-4 py-3 rounded-xl bg-zinc-200 dark:bg-zinc-800 text-xl">♥</button></div>';
if(p.description)h+='<div class="mt-5 text-sm font-extrabold">'+t('details')+'</div><div class="mt-1 text-sm text-zinc-600 dark:text-zinc-300 bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 rounded-xl p-3">'+esc(p.description)+'</div>';
h+='<div class="mt-5"><h3 class="font-bold mb-2">'+t('reviews')+' ('+revs.length+')</h3>';
revs.forEach(r=>{h+='<div class="bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 mb-2">'+stars(r.rating)+'<p class="text-sm text-zinc-600 dark:text-zinc-300 mt-1">'+esc(r.comment||'')+'</p></div>';});
if(USER){h+='<div class="mt-3"><select id="rr" class="w-full py-2 px-3 rounded-lg bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800"><option value="5">★★★★★</option><option value="4">★★★★</option><option value="3">★★★</option><option value="2">★★</option><option value="1">★</option></select><input id="rc" placeholder="Your review..." class="w-full mt-2 py-2 px-3 rounded-lg bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800"><button onclick="postReview(\''+id+'\')" class="w-full mt-2 py-2 rounded-lg bg-nx-500 text-white font-bold">'+t('send')+'</button></div>';}
h+='</div></div>';return h;}

window._q=1;window.dq=function(d){window._q=Math.max(1,Math.min(9,window._q+d));var e=document.getElementById('dq');if(e)e.textContent=window._q;};
window.wish=async function(id){if(!USER){location.hash='#/login';return;}try{await SB.from('ns_wishlists').upsert({user_id:USER.id,product_id:id});toast('♥ '+t('add'),'success');}catch(e){toast('Error adding to wishlist','error');}};
window.postReview=async function(id){if(!USER)return;const rating=+document.getElementById('rr').value;const comment=document.getElementById('rc').value;try{await SB.from('ns_reviews').insert({product_id:id,user_id:USER.id,rating,comment});toast('Review posted','success');render();}catch(e){toast('Error posting review','error');}};

function cartView(){var c=cart();if(!c.length)return '<div class="py-16 text-center text-zinc-500">'+t('empty')+'</div>';var h='<div class="py-4">';var tot=0;
for(var k=0;k<c.length;k++){var p=P(c[k].i);if(!p)continue;tot+=p.price_cents*c[k].q/100;h+='<div class="flex items-center gap-3 bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 mb-2"><img src="'+esc(c[k].image||'')+'" class="w-16 h-16 object-cover rounded-lg" onerror="this.outerHTML=\'<div class=\\\'text-3xl\\\'>🛍️</div>\'"><div class="flex-1"><div class="text-sm font-semibold">'+esc(LAN==='ur'&&c[k].title_ur?c[k].title_ur:c[k].title)+'</div><div class="text-nx-500 font-bold text-sm">'+money(c[k].price/100)+'</div></div><div class="flex items-center gap-2"><button onclick="setQ(\''+c[k].i+'\',-1)" class="w-8 h-8 rounded-lg bg-zinc-200 dark:bg-zinc-800 font-bold">−</button><span class="w-6 text-center font-bold">'+c[k].q+'</span><button onclick="setQ(\''+c[k].i+'\',1)" class="w-8 h-8 rounded-lg bg-nx-500 text-white font-bold">+</button></div></div>';}
h+='<div class="mt-4"><input id="cp" placeholder="'+t('coupon')+'" class="w-full py-2 px-3 rounded-lg bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800"><button onclick="applyCoupon()" class="w-full mt-2 py-2 rounded-lg bg-zinc-200 dark:bg-zinc-800 font-bold">'+t('apply')+'</button></div>';
h+='<div id="tot" class="mt-4 flex items-center justify-between text-lg font-extrabold"><span>'+t('total')+'</span><span class="text-nx-500">'+money(tot)+'</span></div>';
h+='<a href="#/checkout" class="mt-4 block text-center py-4 rounded-xl bg-nx-500 text-white font-extrabold">'+t('checkout')+' →</a></div>';return h;}

window.COUPON=null;
window.applyCoupon=async function(){var code=document.getElementById('cp').value.trim().toUpperCase();try{const{data}=await SB.from('ns_coupons').select('*').eq('code',code).eq('active',true).maybeSingle();
if(!data){toast('Invalid coupon','error');return;}if(data.expires_at&&new Date(data.expires_at)<new Date()){toast('Expired','error');return;}
var c=cart();var tot=0;for(var k=0;k<c.length;k++){var p=P(c[k].i);if(p)tot+=p.price_cents*c[k].q/100;}
var disc=tot*(data.discount_pct||0)/100;window.COUPON={code:code,disc:disc};
document.getElementById('tot').innerHTML='<div><div>'+t('sub')+': '+money(tot)+'</div><div class="text-nx-pink text-sm">'+t('disc')+': -'+money(disc)+'</div></div><span class="text-nx-500">'+money(tot-disc)+'</span>';
toast('Coupon applied','success');}catch(e){toast('Error applying coupon','error');}};

function checkoutView(){return '<div class="py-8 text-center"><h2 class="text-2xl font-extrabold mb-4">'+t('checkout')+'</h2><p class="text-zinc-500 mb-6">'+t('coming')+'</p><a href="checkout.html" class="inline-block px-8 py-4 rounded-xl bg-nx-500 text-white font-extrabold">Go to payment →</a></div>';}

function wishView(){if(!USER)return '<div class="py-16 text-center text-zinc-500">'+t('login')+'</div>';return '<div class="py-4"><h2 class="text-xl font-extrabold mb-4">'+t('wish')+'</h2><div class="grid grid-cols-2 gap-3" id="wishGrid"></div></div>';}

function ordersView(){if(!USER)return '<div class="py-16 text-center text-zinc-500">'+t('login')+'</div>';return '<div class="py-4"><h2 class="text-xl font-extrabold mb-4">'+t('orders')+'</h2><div class="text-center text-zinc-500 py-10">No orders yet</div></div>';}

function sellerView(){return '<div class="py-8"><h2 class="text-2xl font-extrabold mb-4">'+t('sell')+'</h2><p class="text-zinc-500 mb-6">'+(LAN==='ur'?'ایک سبسکرپشن۔ آپ کی دکان، COD لیجر اور واٹس ایپ چیک آؤٹ۔':'One subscription. Your storefront, COD ledger and WhatsApp checkout.')+'</p><a href="checkout.html" class="block text-center py-4 rounded-xl bg-nx-500 text-white font-extrabold">'+t('create')+' →</a></div>';}

function loginView(){return '<div class="py-8"><h2 class="text-2xl font-extrabold mb-4">'+t('login')+'</h2><input id="lemail" type="email" placeholder="'+t('email')+'" class="w-full py-3 px-4 rounded-xl bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 mb-3"><input id="lpass" type="password" placeholder="'+t('pass')+'" class="w-full py-3 px-4 rounded-xl bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 mb-3"><button onclick="doLogin()" class="w-full py-3 rounded-xl bg-nx-500 text-white font-extrabold">'+t('login')+'</button><div class="mt-4 text-center text-sm text-zinc-500">Don\'t have an account? <button onclick="doSignup()" class="text-nx-500 font-bold">'+t('signup')+'</button></div></div>';}

window.doLogin=async function(){var email=document.getElementById('lemail').value;var pass=document.getElementById('lpass').value;const{error}=await SB.auth.signInWithPassword({email,password});if(error){toast(error.message,'error');}else{toast('Welcome back','success');location.hash='#/';}};
window.doSignup=async function(){var email=document.getElementById('lemail').value;var pass=document.getElementById('lpass').value;const{error}=await SB.auth.signUp({email,password});if(error){toast(error.message,'error');}else{toast('Account created','success');location.hash='#/';}};

function render(){
  if(!sessionStorage.getItem('nx2_in')){return;}
  var h=location.hash||'#/';
  var v=document.getElementById('view');
  if(h==='#/'||h===''){v.innerHTML=home();loadDB();}
  else if(h==='#/cart'){v.innerHTML=cartView();}
  else if(h==='#/checkout'){v.innerHTML=checkoutView();}
  else if(h==='#/wish'){v.innerHTML=wishView();}
  else if(h==='#/orders'){v.innerHTML=ordersView();}
  else if(h==='#/seller'){v.innerHTML=sellerView();}
  else if(h==='#/login'){v.innerHTML=loginView();}
  else if(h.startsWith('#/p/')){v.innerHTML=detail(h.split('/')[2]);}
  else{v.innerHTML=home();}
}

window.addEventListener('hashchange',render);
window.addEventListener('load',()=>{session();render();});
applyL();
badge();

/* Countdown timer */
setInterval(()=>{var cd=document.getElementById('cd');if(!cd)return;var end=new Date();end.setHours(23,59,59);var diff=end-new Date();var h=Math.floor(diff/3600000);var m=Math.floor((diff%3600000)/60000);var s=Math.floor((diff%60000)/1000);cd.textContent=String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');},1000);
</script>
</body>
