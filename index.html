<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="google" content="notranslate">
<title>NexusShop — The Future of Commerce</title>
<style>
:root{--bg:#070b21;--glass:rgba(255,255,255,.07);--border:rgba(255,255,255,.14);--text:#eef2ff;--muted:#9aa7c7;
--g1:#f472b6;--g2:#a78bfa;--g3:#22d3ee;--ok:#34d399;--wa:#25D366;--grad:linear-gradient(135deg,var(--g1),var(--g2),var(--g3));--r:18px}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden}
body::before,body::after{content:'';position:fixed;border-radius:50%;filter:blur(100px);opacity:.22;z-index:-1;animation:fl 16s ease-in-out infinite alternate}
body::before{width:460px;height:460px;background:var(--g1);top:-140px;left:-140px}
body::after{width:420px;height:420px;background:var(--g3);bottom:-120px;right:-140px;animation-delay:-8s}
@keyframes fl{to{transform:translate(50px,40px) scale(1.1)}}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:scale(1)}}
@keyframes tin{from{opacity:0;transform:translate(-50%,-16px)}to{opacity:1;transform:translate(-50%,0)}}
@keyframes gradientBg{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
@keyframes gradientText{0%{background-position:0% 50%}100%{background-position:100% 50%}}
@keyframes rotate3d{from{transform:rotateY(0deg) rotateX(10deg)}to{transform:rotateY(360deg) rotateX(10deg)}}
@keyframes floatOrb{to{transform:translate(50px,30px) scale(1.1)}}
[hidden]{display:none!important}

/* === SPLASH SCREEN 3D PREMIUM === */
#splash{position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
background:radial-gradient(circle at center,#1e1b4b 0%,#070b21 100%);overflow:hidden}
#splash::before,#splash::after{content:'';position:absolute;border-radius:50%;animation:floatOrb 10s ease-in-out infinite alternate}
#splash::before{width:400px;height:400px;top:-100px;left:-100px;background:radial-gradient(circle,rgba(0,212,255,.3) 0%,transparent 70%)}
#splash::after{width:300px;height:300px;bottom:-50px;right:-50px;animation-delay:-5s;background:radial-gradient(circle,rgba(244,114,182,.3) 0%,transparent 70%)}
.logo-3d-wrap{perspective:800px;margin-bottom:24px;animation:up .8s ease both}
.logo-3d{width:120px;height:120px;position:relative;transform-style:preserve-3d;animation:rotate3d 8s linear infinite}
.logo-face{position:absolute;inset:0;border-radius:28px;background:var(--grad);display:flex;align-items:center;justify-content:center;font-size:56px;
box-shadow:0 0 50px rgba(167,139,250,.6),inset 0 0 20px rgba(255,255,255,.3);border:2px solid rgba(255,255,255,.2)}
.splash-title{font-size:38px;font-weight:900;letter-spacing:-1px;
background:linear-gradient(90deg,var(--g3),var(--g2),var(--g1),var(--g3));background-size:300% 100%;
-webkit-background-clip:text;background-clip:text;color:transparent;animation:gradientText 6s linear infinite,up .8s .2s ease both}
.splash-sub{margin-top:8px;color:var(--muted);font-size:14px;line-height:1.6;animation:up .8s .4s ease both}
#splash .pills{display:flex;gap:10px;margin-top:24px;animation:up .8s .6s ease both}
#splash .pills button{padding:10px 22px;border-radius:99px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-weight:700;font-size:14px;cursor:pointer;transition:.3s}
#splash .pills button.on{background:var(--grad);color:#0b1030;border-color:transparent;box-shadow:0 0 20px rgba(167,139,250,.5)}
#splash .enter{margin-top:32px;width:100%;max-width:320px;padding:16px;border:0;border-radius:16px;background:var(--grad);color:#0b1030;font-size:16px;font-weight:800;cursor:pointer;box-shadow:0 14px 44px rgba(244,114,182,.4);animation:up .8s .8s ease both;transition:.3s}
#splash .enter:hover{transform:translateY(-3px) scale(1.03);box-shadow:0 20px 50px rgba(244,114,182,.6)}

/* === BANNER PREMIUM ANIMADO === */
.banner-premium{position:relative;overflow:hidden;border-radius:24px;padding:28px 20px;margin:0 0 16px 0;
background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e1b4b 100%);background-size:200% 200%;animation:gradientBg 8s ease infinite;
border:1px solid rgba(255,255,255,.1);box-shadow:0 20px 60px rgba(0,0,0,.4)}
.banner-glow{position:absolute;top:-50%;right:-20%;width:300px;height:300px;
background:radial-gradient(circle,rgba(0,212,255,.3) 0%,transparent 70%);border-radius:50%;animation:floatOrb 8s ease-in-out infinite alternate}
.banner-content{position:relative;z-index:2;text-align:center}
.banner-tag{font-size:11px;font-weight:800;letter-spacing:2px;text-transform:uppercase;color:var(--g3);margin-bottom:8px}
.banner-title{font-size:22px;font-weight:900;line-height:1.3;margin-bottom:10px}
.banner-desc{font-size:13px;color:var(--muted);line-height:1.5}

/* === RESTO DE LA UI (Intacto) === */
header{position:sticky;top:0;z-index:40;display:flex;align-items:center;gap:10px;padding:12px 16px;
background:rgba(7,11,33,.75);backdrop-filter:blur(16px);border-bottom:1px solid var(--border)}
.logo{font-size:20px;font-weight:800;letter-spacing:-.6px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.sp{flex:1}
.icb{position:relative;width:40px;height:40px;border-radius:13px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:16px;cursor:pointer}
.icb:active{transform:scale(.94)}
.bdg{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 5px;border-radius:99px;background:var(--g1);color:#2b0a1e;font-size:10px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 0 12px rgba(244,114,182,.7)}
.lang{padding:9px 14px;border-radius:99px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-weight:700;font-size:12.5px;cursor:pointer}
main{max-width:640px;margin:0 auto;padding:16px 16px 96px}
.search{width:100%;margin-top:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--border);background:var(--glass);color:var(--text);font-size:15px;outline:none;backdrop-filter:blur(10px)}
.search:focus{border-color:var(--g3);box-shadow:0 0 0 3px rgba(34,211,238,.18)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:14px 0 6px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;padding:9px 16px;border-radius:99px;border:1px solid var(--border);background:var(--glass);color:var(--muted);font-size:12.5px;font-weight:700;cursor:pointer}
.chip.on{background:var(--grad);color:#0b1030;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px}
.pcard{position:relative;border-radius:var(--r);overflow:hidden;border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(12px);animation:up .45s both;cursor:pointer}
.pcard:active{transform:scale(.98)}
.pimg{width:100%;aspect-ratio:1;object-fit:cover;background:rgba(255,255,255,.05);display:block}
.pbody{padding:10px 12px 12px}
.pname{font-size:13px;font-weight:600;line-height:1.35;min-height:35px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pprice{margin:6px 0 8px;font-size:15px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.pacts{display:flex;gap:6px}
.pacts button,.pacts span{flex:1;padding:10px 4px;border-radius:11px;font-size:11.5px;font-weight:800;cursor:pointer;font-family:inherit}
.add{border:0;background:var(--grad);color:#0b1030}
.fav{border:1px solid var(--border);background:transparent;color:var(--muted)}
.fav.on{color:var(--g1);border-color:rgba(244,114,182,.5)}
.off{margin-top:10px;padding:12px 14px;border-radius:14px;border:1px solid rgba(251,191,36,.35);background:rgba(251,191,36,.08);color:#fcd34d;font-size:12.5px;line-height:1.6}
.ribbon{position:absolute;top:8px;left:8px;z-index:2;background:rgba(251,191,36,.92);color:#3b2504;font-size:9px;font-weight:900;padding:3px 9px;border-radius:99px;letter-spacing:.6px}
.demob{padding:10px 4px;border-radius:11px;font-size:10px;font-weight:800;color:#fcd34d;background:rgba(251,191,36,.1);border:1px solid rgba(251,191,36,.35);text-align:center;cursor:default}
.infob{margin:12px 0;padding:13px 15px;border-radius:14px;border:1px solid rgba(34,211,238,.4);background:rgba(34,211,238,.08);color:#a5f3fc;font-size:12.5px;line-height:1.6}
.infob a{color:#67e8f9;font-weight:800}
.card{border-radius:var(--r);border:1px solid var(--border);background:var(--glass);backdrop-filter:blur(12px);padding:18px;margin-bottom:12px;animation:up .4s both}
h2.t{font-size:17px;font-weight:800;margin-bottom:12px}
.row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);margin-bottom:10px}
.row img{width:58px;height:58px;border-radius:12px;object-fit:cover;background:rgba(255,255,255,.06)}
.row .inf{flex:1;min-width:0}
.row .nm{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pr{font-size:13px;font-weight:800;color:var(--g3)}
.q{display:flex;align-items:center;gap:8px}
.q button{width:32px;height:32px;border-radius:10px;border:0;background:var(--grad);color:#0b1030;font-weight:800;font-size:15px;cursor:pointer}
.q span{min-width:20px;text-align:center;font-weight:800}
.btn{width:100%;padding:15px;border:0;border-radius:15px;background:var(--grad);color:#0b1030;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;box-shadow:0 10px 30px rgba(167,139,250,.3)}
.btn:active{transform:scale(.98)}
.btn.wa{background:var(--wa);color:#06281a;box-shadow:0 10px 30px rgba(37,211,102,.3)}
.btn.ghost{background:transparent;border:1px solid var(--border);color:var(--text);box-shadow:none}
.btn+.btn{margin-top:10px}
.empty{padding:44px 22px;text-align:center;color:var(--muted);font-size:13.5px;line-height:1.7;border:1.5px dashed var(--border);border-radius:var(--r)}
.tot{display:flex;justify-content:space-between;padding:14px 4px;font-size:17px;font-weight:800}
.tot b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
input.f{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:var(--text);font-size:15px;outline:none;margin-bottom:10px;font-family:inherit}
input.f:focus{border-color:var(--g3)}
.lbl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 6px}
.dimg{width:100%;aspect-ratio:1.1;object-fit:cover;border-radius:22px;background:rgba(255,255,255,.05)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.tag{padding:6px 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--border);font-size:11px;font-weight:700;color:var(--muted)}
.shopline{margin-top:12px;padding:12px 14px;border-radius:14px;border:1px solid var(--border);background:rgba(255,255,255,.04);display:flex;align-items:center;gap:10px;font-size:12.5px;color:var(--muted)}
.shopline b{color:var(--text);font-weight:700}
nav{position:fixed;bottom:0;left:0;right:0;z-index:40;display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom));
background:rgba(7,11,33,.85);backdrop-filter:blur(18px);border-top:1px solid var(--border)}
nav button{flex:1;border:0;background:none;color:var(--muted);font-size:10px;font-weight:800;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;padding:6px 0;border-radius:14px}
nav button i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.7;transition:.2s}
nav button.on{color:var(--text)}
nav button.on i{filter:none;opacity:1;transform:scale(1.12);drop-shadow:0 0 10px rgba(34,211,238,.8)}
#toasts{position:fixed;top:70px;left:50%;transform:translateX(-50%);z-index:70;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:92vw}
.toast{padding:12px 20px;border-radius:14px;font-size:13.5px;font-weight:700;animation:tin .3s ease both;box-shadow:0 14px 40px rgba(0,0,0,.45);backdrop-filter:blur(10px)}
.toast.ok{background:rgba(52,211,153,.16);border:1px solid rgba(52,211,153,.5);color:#a7f3d0}
.toast.err{background:rgba(248,113,113,.16);border:1px solid rgba(248,113,113,.5);color:#fecaca}
.toast.info{background:rgba(34,211,238,.14);border:1px solid rgba(34,211,238,.45);color:#cffafe}
footer{max-width:640px;margin:0 auto;padding:20px 16px 8px;text-align:center;color:var(--muted);font-size:11.5px}
.urdu,.urdu *{font-family:'Noto Nastaliq Urdu',system-ui,serif!important;line-height:2.05}
</style>
</head>
<body>

<div id="splash">
  <div class="logo-3d-wrap">
    <div class="logo-3d">
      <div class="logo-face">🛒</div>
    </div>
  </div>
  <h1 class="splash-title">NexusShop</h1>
  <p class="splash-sub" id="spTag">Your store. Your country. Your income.</p>
  <div class="pills">
    <button id="pEn" class="on" onclick="pickLang('en')">English</button>
    <button id="pUr" onclick="pickLang('ur')">اردو</button>
  </div>
  <button class="enter" onclick="enterShop()">Enter the Future · مستقبل میں خوش آمدید</button>
</div>

<header>
  <span class="logo">NexusShop</span><span class="sp"></span>
  <button class="lang" id="langB" onclick="toggleLang()">اردو</button>
  <button class="icb" onclick="go('wish')">♥</button>
  <button class="icb" onclick="go('cart')">🛒<span class="bdg" id="bdg" hidden>0</span></button>
  <button class="icb" id="userB" onclick="userTap()">👤</button>
</header>

<main id="view"></main>
<footer>© 2026 NexusShop · Built in public from Argentina 🇦🇷 · Tested in Pakistan 🇵🇰</footer>

<nav id="nav">
  <button data-v="home" onclick="go('home')"><i>🏠</i><span data-i="home"></span></button>
  <button data-v="wish" onclick="go('wish')"><i>💖</i><span data-i="wish"></span></button>
  <button data-v="cart" onclick="go('cart')"><i>🛒</i><span data-i="cart"></span></button>
  <button data-v="orders" onclick="go('orders')"><i>📦</i><span data-i="orders"></span></button>
  <button data-v="sell" onclick="go('sell')"><i>🏪</i><span data-i="sell"></span></button>
</nav>

<div id="toasts"></div>

<script>
/* ========== NÚCLEO 100% INTACTO (Solo se actualizó vHome para el nuevo banner) ========== */
var LS={get:function(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v==null?d:v}catch(e){return d}},
        set:function(k,v){localStorage.setItem(k,JSON.stringify(v))}};
var LAN=LS.get('nx_lang','en'), USER=null, SB=null, PRODS=[], CATS=[], VIEW='home', CUR=null, QTY=1;
var WA_DEFAULT='542257550650';
var I={
en:{home:'Home',wish:'Wishlist',cart:'Cart',orders:'Orders',sell:'Sell',search:'Search products…',add:'Add',
 tag:'Your store. Your country. Your income.',all:'All',
 stock:'in stock',cod:'Cash on Delivery',del:'Delivery tomorrow',ret:'7-day returns',qty:'Quantity',
 emptyCart:'Your cart is empty. Add something you love.',wishEmpty:'Tap 💖 on any product to save it here.',
 ordersEmpty:'No orders yet. When you order, tracking lives here.',total:'Total',orderWA:'Order on WhatsApp (COD)',
 sellT:'Sell on NexusShop',sellP:'One subscription: your storefront, COD ledger and WhatsApp checkout. From PKR 2,500/month.',
 sellBtn:'See plans & subscribe',openCenter:'Open Seller Center',login:'Log in',signup:'Sign up',email:'Email',pass:'Password',logout:'Log out',
 offline:'Offline mode: catalog syncs when connection returns. Cart, wishlist and navigation keep working.',
 noProds:'Products appear as sellers onboard this week.',details:'Details',waSolo:'Chat with seller',back:'← Back',
 demoBanner:'Showcase items are DEMO examples — not real products. Real sellers onboard this week.',
 demoDetail:'DEMO showcase item — not a real product. Real sellers onboard this week.'},
ur:{home:'ہوم',wish:'پسندیدہ',cart:'کارٹ',orders:'آرڈرز',sell:'بیچیں',search:'مصنوعات تلاش کریں…',add:'شامل',
 tag:'آپ کی دکان۔ آپ کا ملک۔ آپ کی کمائی۔',all:'تمام',
 stock:'اسٹاک میں',cod:'کیش آن ڈیلیوری',del:'کل ڈیلیوری',ret:'7 دن واپسی',qty:'تعداد',
 emptyCart:'کارٹ خالی ہے۔',wishEmpty:'کسی پروڈکٹ پر 💖 دبائیں۔',ordersEmpty:'ابھی کوئی آرڈر نہیں۔',total:'کل',
 orderWA:'واٹس ایپ پر آرڈر (COD)',sellT:'NexusShop پر فروخت',sellP:'ایک سبسکرپشن: دکان، COD لیجر، واٹس ایپ چیک آؤٹ۔ PKR 2,500/ماہ سے۔',
 sellBtn:'پلان دیکھیں',openCenter:'سیلر سینٹر کھولیں',login:'لاگ ان',signup:'سائن اپ',email:'ای میل',pass:'پاس ورڈ',logout:'لاگ آؤٹ',
 offline:'آف لائن موڈ: کنکشن آنے پر کیٹلاگ sync ہوگا۔',noProds:'اس ہفتہ فروش شامل ہو رہے ہیں۔',details:'تفصیل',waSolo:'فروخت کنندہ سے چیٹ',back:'← واپس',
 demoBanner:'شوکیس آئٹمز DEMO مثالیں ہیں — حقیقی مصنوعات نہیں۔',
 demoDetail:'DEMO شوکیس آئٹم — حقیقی پروڈکٹ نہیں۔'}};

function t(k){return (I[LAN]&&I[LAN][k])||I.en[k]||k}
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK')}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function toast(m,type){var w=document.getElementById('toasts');var e=document.createElement('div');
 e.className='toast '+(type||'info');e.textContent=m;w.appendChild(e);
 setTimeout(function(){e.style.opacity='0';e.style.transition='opacity .3s';setTimeout(function(){e.remove()},320)},2600)}
function applyLang(){document.documentElement.lang=LAN;document.documentElement.dir=LAN==='ur'?'rtl':'ltr';
 document.body.classList.toggle('urdu',LAN==='ur');
 document.getElementById('langB').textContent=LAN==='ur'?'EN':'اردو';
 document.getElementById('spTag').textContent=t('tag');
 document.querySelectorAll('[data-i]').forEach(function(e){e.textContent=t(e.dataset.i)})}
function pickLang(l){LAN=l;LS.set('nx_lang',l);
 document.getElementById('pEn').classList.toggle('on',l==='en');
 document.getElementById('pUr').classList.toggle('on',l==='ur');applyLang()}
function toggleLang(){pickLang(LAN==='ur'?'en':'ur');render()}
function enterShop(){sessionStorage.setItem('nx_in','1');document.getElementById('splash').style.display='none';render();loadCatalog()}

function cart(){return LS.get('nx_cart',[])}
function saveCart(c){LS.set('nx_cart',c);badge()}
function badge(){var n=cart().reduce(function(s,x){return s+x.q},0);var b=document.getElementById('bdg');b.hidden=!n;b.textContent=n}
function wish(){return LS.get('nx_wish',[])}
function addCart(id){var p=PRODS.find(function(x){return x.id===id});if(!p)return;
 if(p.demo){toast('DEMO item — cannot add to cart','info');return}
 var c=cart(),f=c.find(function(x){return x.i===id});
 if(f)f.q++;else c.push({i:id,q:1,name:p.name,price:p.price,img:p.img,wa:p.wa,shopName:p.shopName});
 saveCart(c);toast('✓ '+t('add'),'ok');render()}
function setQ(id,d){var c=cart();var f=c.find(function(x){return x.i===id});if(!f)return;
 f.q+=d;if(f.q<1)c=c.filter(function(x){return x.i!==id});saveCart(c);render()}
function toggleWish(id){var w=wish();var p=PRODS.find(function(x){return x.id===id});
 if(p.demo){toast('DEMO item — cannot save','info');return}
 if(w.includes(id)){w=w.filter(function(x){return x!==id});toast('Removed','info')}
 else{w.push(id);toast('💖 Saved','ok')}
 LS.set('nx_wish',w);render()}
function waCart(){var c=cart().filter(function(x){return !x.demo});if(!c.length)return;
 var first=c[0];var wa=(first&&first.wa)||WA_DEFAULT;
 var shopName=(first&&first.shopName)||'Seller';
 var msg='Assalam o Alaikum '+shopName+'! I want to order from NexusShop:\n'+
  c.map(function(x){return '• '+x.name+' x'+x.q+' — '+money(x.price*x.q)}).join('\n')+
  '\n'+t('total')+': '+money(c.reduce(function(s,x){return s+x.price*x.q},0))+' (COD)';
 window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank')}
function waOne(p){var wa=String((p.wa)||WA_DEFAULT).replace(/\D/g,'');var shopName=p.shopName||'Seller';
 var msg=(LAN==='ur'?'السلام علیکم '+shopName+'! مجھے دلچسپی ہے: ':'Hi '+shopName+'! I\'m interested in: ')+p.name+' — '+money(p.price);
 window.open('https://wa.me/'+wa+'?text='+encodeURIComponent(msg),'_blank')}

function go(v){VIEW=v;CUR=null;render();window.scrollTo(0,0);
 document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===v)})}
function openP(id){CUR=id;QTY=1;VIEW='detail';render();window.scrollTo(0,0)}

/* === AQUÍ ESTÁ EL NUEVO BANNER PREMIUM === */
function vHome(){
 var bannerTag = LAN==='ur' ? 'مستقبل کی مارکیٹ' : 'The Future of Commerce';
 var bannerTitle = LAN==='ur' ? 'زیرو فیس۔ ڈائریکٹ واٹس ایپ۔<br>آپ کی دکان، آپ کے اصول۔' : 'Zero Fees. Direct WhatsApp.<br>Your Store, Your Rules.';
 var bannerDesc = LAN==='ur' ? 'پاکستان کی پہلی مارکیٹ جہاں آپ کی کمائی 100٪ آپ کی ہے' : 'Pakistan\'s first marketplace where your earnings are 100% yours.';
 
 var h = '<div class="banner-premium">'+
  '<div class="banner-glow"></div>'+
  '<div class="banner-content">'+
  '<div class="banner-tag">🚀 '+bannerTag+'</div>'+
  '<h2 class="banner-title">'+bannerTitle+'</h2>'+
  '<div class="banner-desc">'+bannerDesc+'</div>'+
  '</div></div>'+
 '<input class="search" placeholder="'+t('search')+'" oninput="filt(this.value)">'+
 '<div class="chips"><button class="chip on" onclick="cat(0,this)">'+t('all')+'</button>'+
 CATS.map(function(c){return '<button class="chip" onclick="cat('+c.id+',this)">'+esc(c.name)+'</button>'}).join('')+'</div>'+
 '<div class="infob">ℹ️ '+t('demoBanner')+' <a href="seller.html">'+t('openCenter')+' →</a></div>'+
 '<div id="off" class="off" hidden>📡 '+t('offline')+'</div>'+
 '<div class="grid" id="grid">'+PRODS.map(card).join('')+'</div>'+
 (PRODS.length?'':'<div class="empty">'+t('noProds')+'</div>');
 return h;
}

function card(p){var w=wish().includes(p.id);
 var acts=p.demo?'<span class="demob">DEMO · example only</span>'
 :'<button class="add" onclick="event.stopPropagation();addCart(\''+p.id+'\')">+ '+t('add')+'</button>'+
  '<button class="fav'+(w?' on':'')+'" onclick="event.stopPropagation();toggleWish(\''+p.id+'\')">💖</button>';
 return '<div class="pcard" onclick="openP(\''+p.id+'\')">'+(p.demo?'<span class="ribbon">DEMO</span>':'')+
 (p.img?'<img class="pimg" src="'+esc(p.img)+'" loading="lazy" onerror="this.outerHTML=\'<div class=pimg style=&quot;display:flex;align-items:center;justify-content:center;font-size:44px&quot;>🛍️</div>\'">':'<div class="pimg" style="display:flex;align-items:center;justify-content:center;font-size:44px">🛍️</div>')+
 '<div class="pbody"><div class="pname">'+esc(p.name)+'</div><div class="pprice">'+money(p.price)+'</div>'+
 '<div class="pacts">'+acts+'</div></div></div>'}

function vDetail(){var p=PRODS.find(function(x){return x.id===CUR});if(!p)return vHome();var w=wish().includes(p.id);
 var actions;
 if(p.demo){
  actions='<div class="infob" style="margin-top:14px">ℹ️ '+t('demoDetail')+'</div>';
 }else{
  actions='<div style="margin-top:14px"><button class="btn" onclick="addCur()">+ '+t('add')+' — '+money(p.price*QTY)+'</button>'+
  '<button class="btn wa" onclick="waOne(PRODS.find(function(x){return x.id===CUR}))">💬 '+(p.shopName||t('waSolo'))+' '+t('waSolo')+'</button>'+
  '<button class="btn ghost" onclick="toggleWish(\''+p.id+'\')">'+(w?'💖 Saved':' '+t('wish'))+'</button></div>';
 }
 return '<div class="card"><button class="btn ghost" style="width:auto;padding:10px 16px;margin:0 0 12px" onclick="go(\'home\')">'+t('back')+'</button>'+
 (p.img?'<img class="dimg" src="'+esc(p.img)+'" onerror="this.outerHTML=\'<div class=dimg style=&quot;display:flex;align-items:center;justify-content:center;font-size:70px&quot;>🛍️</div>\'">':'<div class="dimg" style="display:flex;align-items:center;justify-content:center;font-size:70px">🛍️</div>')+
 (p.demo?'<div class="infob" style="margin-top:12px">⚠ '+t('demoDetail')+'</div>':'')+
 '<h2 class="t" style="margin-top:14px">'+esc(p.name)+'</h2>'+
 (p.shopName?'<div class="shopline">🏪 Sold by <b>'+esc(p.shopName)+'</b></div>':'')+
 '<div style="font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;margin-top:8px">'+money(p.price)+'</div>'+
 '<div class="tags"><span class="tag">🚚 '+t('del')+'</span><span class="tag">💵 '+t('cod')+'</span><span class="tag">↩ '+t('ret')+'</span></div>'+
 '<div class="lbl">'+t('qty')+'</div><div class="q"><button onclick="dq(-1)">−</button><span id="q">'+QTY+'</span><button onclick="dq(1)">+</button></div>'+
 actions+
 (p.desc?'<div class="lbl" style="margin-top:16px">'+t('details')+'</div><p style="font-size:13.5px;color:var(--muted);line-height:1.7">'+esc(p.desc)+'</p>':'')+'</div>'}

function vCart(){var c=cart().filter(function(x){return !x.demo});
 if(!c.length)return '<div class="card"><h2 class="t">🛒 '+t('cart')+'</h2><div class="empty">'+t('emptyCart')+'</div></div>';
 var tot=c.reduce(function(s,x){return s+x.price*x.q},0);
 var first=c[0];var shopLine=first&&first.shopName?'<div class="shopline">🏪 Ordering from <b>'+esc(first.shopName)+'</b></div>':'';
 return '<div class="card"><h2 class="t">🛒 '+t('cart')+'</h2>'+shopLine+
 c.map(function(x){return '<div class="row">'+(x.img?'<img src="'+esc(x.img)+'" onerror="this.outerHTML=\'<div style=&quot;font-size:30px&quot;>🛍️</div>\'">':'<div style="font-size:30px">🛍️</div>')+
 '<div class="inf"><div class="nm">'+esc(x.name)+'</div><div class="pr">'+money(x.price*x.q)+'</div></div>'+
 '<div class="q"><button onclick="setQ(\''+x.i+'\',-1)">−</button><span>'+x.q+'</span><button onclick="setQ(\''+x.i+'\',1)">+</button></div></div>'}).join('')+
 '<div class="tot"><span>'+t('total')+'</span><b>'+money(tot)+'</b></div>'+
 '<button class="btn wa" onclick="waCart()">💬 '+t('orderWA')+'</button></div>'}

function vWish(){var w=wish();var items=PRODS.filter(function(p){return w.includes(p.id)});
 return '<div class="card"><h2 class="t">💖 '+t('wish')+'</h2>'+
 (items.length?'<div class="grid" style="margin:0">'+items.map(card).join('')+'</div>':'<div class="empty">'+t('wishEmpty')+'</div>')+'</div>'}

function vOrders(){return '<div class="card"><h2 class="t">📦 '+t('orders')+'</h2><div class="empty">'+t('ordersEmpty')+'</div></div>'}

function vSell(){return '<div class="card" style="text-align:center"><div style="font-size:52px">🏪</div>'+
 '<h2 class="t" style="margin-top:8px">'+t('sellT')+'</h2><p style="color:var(--muted);font-size:13.5px;line-height:1.7">'+t('sellP')+'</p>'+
 '<button class="btn" style="margin-top:16px" onclick="location.href=\'seller.html\'">🏪 '+t('openCenter')+' →</button>'+
 '<button class="btn ghost" onclick="location.href=\'checkout.html\'">'+t('sellBtn')+' →</button></div>'}

function vLogin(){return '<div class="card"><h2 class="t">👤 '+t('login')+'</h2>'+
 '<div class="lbl">'+t('email')+'</div><input class="f" id="le" type="email" placeholder="'+t('email')+'">'+
 '<div class="lbl">'+t('pass')+'</div><input class="f" id="lp" type="password" placeholder="'+t('pass')+'">'+
 '<button class="btn" onclick="doLogin()">'+t('login')+'</button>'+
 '<button class="btn ghost" onclick="doSignup()">'+t('signup')+'</button></div>'}

function dq(d){QTY=Math.max(1,Math.min(9,QTY+d));var e=document.getElementById('q');if(e)e.textContent=QTY}
function addCur(){for(var i=0;i<QTY;i++)addCart(CUR);go('cart')}
window.filt=function(v){var g=document.getElementById('grid');if(!g)return;v=(v||'').toLowerCase();
 var l=PRODS.filter(function(p){return !v||p.name.toLowerCase().indexOf(v)>=0});
 g.innerHTML=l.map(card).join('')||'<div class="empty" style="grid-column:1/-1">'+t('noProds')+'</div>'};
window.cat=function(id,btn){document.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on')});btn.classList.add('on');
 var g=document.getElementById('grid');var l=id?PRODS.filter(function(p){return p.cat===id}):PRODS;
 g.innerHTML=l.map(card).join('')||'<div class="empty" style="grid-column:1/-1">'+t('noProds')+'</div>'};

function render(){if(!sessionStorage.getItem('nx_in'))return;applyLang();
 var v=VIEW==='home'?vHome():VIEW==='detail'?vDetail():VIEW==='cart'?vCart():VIEW==='wish'?vWish():VIEW==='orders'?vOrders():VIEW==='sell'?vSell():vLogin();
 document.getElementById('view').innerHTML=v;
 document.querySelectorAll('#nav button').forEach(function(b){b.classList.toggle('on',b.dataset.v===VIEW)});badge()}

function userTap(){if(USER){SB.auth.signOut();USER=null;document.getElementById('userB').textContent='👤';toast(t('logout'),'info');go('home')}else go('login')}

async function ensureSB(){if(SB)return SB;try{
 var m=await import('https://esm.sh/@supabase/supabase-js@2.45.4');
 SB=m.createClient('https://iafofzwxkzwliisvstfy.supabase.co','sb_publishable_uXpbSgDe4OXVWibgQ187RA_INLaX0SY');return SB}catch(e){return null}}

async function doLogin(){var s=await ensureSB();if(!s)return toast(t('offline'),'err');
 var r=await s.auth.signInWithPassword({email:document.getElementById('le').value,password:document.getElementById('lp').value});
 if(r.error)return toast(r.error.message,'err');USER=r.data.user;document.getElementById('userB').textContent='✅';toast('✓ '+t('login'),'ok');go('home')}
async function doSignup(){var s=await ensureSB();if(!s)return toast(t('offline'),'err');
 var r=await s.auth.signUp({email:document.getElementById('le').value,password:document.getElementById('lp').value});
 if(r.error)return toast(r.error.message,'err');toast('✓ '+t('signup'),'ok');go('home')}

async function loadCatalog(){var s=await ensureSB();if(!s){var o=document.getElementById('off');if(o)o.hidden=false;return}
 try{var a=await s.from('ns_products').select('*,ns_shops(name,whatsapp)').eq('status','active').limit(60);
  if(!a.error&&a.data&&a.data.length){PRODS=a.data.map(function(p){return{id:p.id,name:LAN==='ur'&&p.title_ur?p.title_ur:p.title_en,price:(p.price_cents||0)/100,img:p.image_url,cat:p.category_id,desc:p.description,demo:!!p.is_demo,wa:(p.ns_shops&&p.ns_shops.whatsapp)||null,shopName:(p.ns_shops&&p.ns_shops.name)||null}});}
  else{var b=await s.from('products').select('*').limit(60);
   if(!b.error&&b.data)PRODS=b.data.map(function(p){return{id:p.id,name:p.name||p.title||'Item',price:p.price_pkr||p.price||0,img:p.image_url,cat:p.category_id,desc:p.description,demo:true,wa:null,shopName:null}});}
  var c=await s.from('ns_categories').select('*');if(!c.error&&c.data)CATS=c.data.map(function(x){return{id:x.id,name:LAN==='ur'&&x.name_ur?x.name_ur:x.name_en}});
 }catch(e){}
 render()}

applyLang();badge();
if(sessionStorage.getItem('nx_in')){document.getElementById('splash').style.display='none';render();loadCatalog()}
</script>
