<!DOCTYPE html><html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>NexusShop</title>
<style>
:root{--pk:#046A38;--pkd:#01411C;--gold:#ffd166}
*{box-sizing:border-box;margin:0;padding:0}body{font-family:system-ui;background:#f4f6f4;padding-bottom:64px}
header{position:sticky;top:0;background:var(--pk);color:#fff;padding:10px 14px;z-index:9;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.2)}
.logo{font-weight:800;font-size:20px}.logo span{color:var(--gold)}
.hdr a{color:#fff;text-decoration:none;margin-left:10px;font-size:13px}
.hero{background:linear-gradient(135deg,var(--pk),var(--pkd));color:#fff;padding:22px 16px;text-align:center}
.hero h1{font-size:24px}.hero p{opacity:.9;font-size:13px;margin:4px 0 12px}
.hero input{width:100%;max-width:420px;padding:11px;border:0;border-radius:24px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(155px,1fr));gap:12px;padding:14px}
.card{background:#fff;border-radius:12px;padding:12px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer;overflow:hidden}
.card .em{font-size:44px}.card img{width:100%;height:110px;object-fit:cover;border-radius:8px}
.card h3{font-size:13px;margin:6px 0}.card .p{color:var(--pk);font-weight:800}
.stores{display:flex;gap:10px;overflow-x:auto;padding:14px}
.store{background:#fff;border-radius:12px;padding:12px 16px;min-width:130px;text-align:center;box-shadow:0 1px 4px rgba(0,0,0,.12);cursor:pointer}
.store .em{font-size:30px}
.bar{position:fixed;bottom:0;left:0;right:0;background:var(--pkd);color:#fff;padding:14px;display:flex;justify-content:space-between;cursor:pointer;font-weight:700}
button{background:var(--pk);color:#fff;border:0;border-radius:10px;padding:12px 16px;font-size:15px;width:100%;margin-top:8px;font-weight:700}
button.wa{background:#25d366}
.box{background:#fff;border-radius:12px;padding:16px;margin:12px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.pay .m{background:#fff;border-radius:10px;padding:13px;margin:8px 0;box-shadow:0 1px 4px rgba(0,0,0,.1);cursor:pointer;border:2px solid transparent}
.pay .m.sel{border-color:var(--pk);background:#eaf5ef}
input,select{width:100%;padding:11px;margin:5px 0;border:1px solid #ccc;border-radius:10px;font-size:15px}
.stars{color:#f59e0b}.muted{color:#666;font-size:13px}
footer{background:var(--pkd);color:#cfe8d8;padding:18px 16px;font-size:13px;margin-top:20px}
footer a{color:#fff;text-decoration:none;margin-right:12px}
.row{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee}
a.back{color:var(--pk);text-decoration:none;font-weight:700}
</style></head><body>
<header><div class="logo">🛍️ Nexus<span>Shop</span></div>
<div class="hdr"><a href="#/track">📦</a><a href="#" onclick="setLang('en')">EN</a><a href="#" onclick="setLang('es')">ES</a><a href="#" onclick="setLang('ur')">اردو</a></div></header>
<div id="app"></div>
<div class="bar" onclick="go('cart')"><span id="bartxt">🛒 Cart</span><span id="bartot"></span></div>
<footer>
<a href="#/terms">Terms & Conditions</a><a href="#/privacy">Privacy Policy</a><a href="#/track">Track Order</a>
<p style="margin-top:10px">© 2026 NexusShop · Built in Argentina 🇦🇷 for Pakistan 🇵🇰 and the world · Partners: add ?ref=CODE to any link</p>
</footer>
<script>
var DATA=__DATA__;
var SUPA_URL="https://sewdrblymwyojizugafj.supabase.co",SUPA_KEY="";
var L={en:{cart:"🛒 Cart",add:"Add to cart",checkout:"Checkout",total:"Total",back:"← Back",paym:"Payment method",reviews:"Reviews",all:"All products",search:"Search products…",name:"Full name",phone:"WhatsApp number",addr:"Address",city:"City",place:"Place order",track:"Track order",tid:"Order ID (e.g. NS-ABC123)",empty:"Your cart is empty",stores:"Official stores",qty:"Qty"},
es:{cart:"🛒 Carrito",add:"Agregar",checkout:"Comprar",total:"Total",back:"← Volver",paym:"Método de pago",reviews:"Reseñas",all:"Todos los productos",search:"Buscar productos…",name:"Nombre completo",phone:"Número de WhatsApp",addr:"Dirección",city:"Ciudad",place:"Confirmar pedido",track:"Seguir pedido",tid:"ID del pedido (ej. NS-ABC123)",empty:"Tu carrito está vacío",stores:"Tiendas oficiales",qty:"Cant."},
ur:{cart:"🛒 ٹوکری",add:"شامل کریں",checkout:"چیک آؤٹ",total:"کل",back:"← واپس",paym:"ادائیگی کا طریقہ",reviews:"جائزے",all:"تمام مصنوعات",search:"تلاش…",name:"پورا نام",phone:"واٹس ایپ نمبر",addr:"پتہ",city:"شہر",place:"آرڈر کریں",track:"آرڈر ٹریک",tid:"آرڈر آئی ڈی",empty:"ٹوکری خالی ہے",stores:"سرکاری دکانیں",qty:"تعداد"}};
var lang=localStorage.getItem("nx_lang")||"en";
function t(k){return (L[lang]&&L[lang][k])||L.en[k];}
function setLang(l){lang=l;localStorage.setItem("nx_lang",l);render();}
function go(r){location.hash="#/"+r;}
var mref=location.search.match(/[?&]ref=([A-Za-z0-9_]+)/);if(mref)localStorage.setItem("nx_ref",mref[1]);
var Q="";
var PH=[["watch","photo-1524592094714-0f0654e20319"],["earbud","photo-1590658268037-6bf12165a8df"],["headphone","photo-1590658268037-6bf12165a8df"],["power bank","photo-1609091839311-d5365f9ff1c5"],["lawn","photo-1595777457583-95e059d581b8"],["dress","photo-1595777457583-95e059d581b8"],["shalwar","photo-1596755094514-f87e34085b2c"],["kameez","photo-1596755094514-f87e34085b2c"],["dupatta","photo-1601924994987-69e26d50dc26"],["scarf","photo-1601924994987-69e26d50dc26"],["bedsheet","photo-1522708323590-d24dbb6b0267"],["bed","photo-1522708323590-d24dbb6b0267"],["clock","photo-1563861826100-9cb868fdbe1c"],["led","photo-1550989460-0adf9ea622e2"],["light","photo-1550989460-0adf9ea622e2"],["chai","photo-1541167760496-1628856ab772"],["karak","photo-1541167760496-1628856ab772"],["tea","photo-1541167760496-1628856ab772"],["croissant","photo-1555507036-ab1f4038808a"],["fruit","photo-1555507036-ab1f4038808a"]];
function photo(p){if(p.img)return p.img;var n=(p.nombre||"").toLowerCase();for(var i=0;i<PH.length;i++){if(n.indexOf(PH[i][0])>=0)return "https://images.unsplash.com/"+PH[i][1]+"?w=400&q=60";}return null;}
function gc(){try{return JSON.parse(localStorage.getItem("nx_cart")||"{}")}catch(e){return{}}}
function sc(c){localStorage.setItem("nx_cart",JSON.stringify(c));bar();}
function allp(){var o=[];for(var s in DATA.tiendas){var ti=DATA.tiendas[s];(ti.productos||[]).forEach(function(p,i){o.push({s:s,ti:ti,p:p,i:i});});}return o;}
function bar(){var c=gc(),n=0,tot=0;for(var k in c){n+=c[k].q;tot+=c[k].q*c[k].p;}document.getElementById("bartxt").textContent=t("cart")+" ("+n+")";document.getElementById("bartot").textContent=tot?"Rs. "+tot:"";}
function img(p){var u=photo(p);return u?"<img src='"+u+"' loading='lazy'>":"<div class='em'>"+(p.emoji||"🛍️")+"</div>";}
function stars(r){var n=(r||[]).length;if(!n)return"";var s=0;r.forEach(function(x){s+=(x.estrellas||5);});return "<div class='stars'>"+"★".repeat(Math.round(s/n))+" "+(s/n).toFixed(1)+"</div>";}
function home(){var h="<div class='hero'><h1>🛍️ NexusShop 🇵🇰</h1><p>"+t("stores")+" · "+t("all")+"</p><input placeholder='"+t("search")+"' value='"+Q+"' oninput='Q=this.value;render()'></div><div class='stores'>";
for(var s in DATA.tiendas){var ti=DATA.tiendas[s];h+="<div class='store' onclick=\"go('store/"+s+"')\"><div class='em'>"+(ti.emoji||"🏪")+"</div><b>"+ti.nombre+"</b>"+stars(ti.resenas)+"</div>";}
h+="</div><div class='grid'>";
allp().forEach(function(x,idx){if(Q&&x.p.nombre.toLowerCase().indexOf(Q.toLowerCase())<0)return;h+="<div class='card' onclick=\"go('p/"+idx+"')\">"+img(x.p)+"<h3>"+x.p.nombre+"</h3><div class='p'>Rs. "+x.p.precio+"</div></div>";});
return h+"</div>";}
function store(s){var ti=DATA.tiendas[s];if(!ti)return home();var h="<div class='box'><a class='back' href='#/'>"+t("back")+"</a><h2>"+(ti.emoji||"🏪")+" "+ti.nombre+"</h2>"+stars(ti.resenas)+"</div><div class='grid'>";
allp().forEach(function(x,idx){if(x.s===s)h+="<div class='card' onclick=\"go('p/"+idx+"')\">"+img(x.p)+"<h3>"+x.p.nombre+"</h3><div class='p'>Rs. "+x.p.precio+"</div></div>";});
return h+"</div>";}
function prod(idx){var x=allp()[idx];if(!x)return home();var p=x.p;
return "<div class='box' style='text-align:center'>"+img(p)+"<h2>"+p.nombre+"</h2><div class='p' style='font-size:22px;color:var(--pk);font-weight:800'>Rs. "+p.p.precio?"" : "";}
function prod(idx){var x=allp()[idx];if(!x)return home();var p=x.p;
return "<div class='box' style='text-align:center'>"+img(p)+"<h2>"+p.nombre+"</h2><div style='font-size:22px;color:var(--pk);font-weight:800'>Rs. "+p.precio+"</div>"+stars(x.ti.resenas)+"<p class='muted'>"+x.ti.nombre+"</p><button onclick=\"add("+idx+")\">"+t("add")+"</button><a href='https://wa.me/"+(x.ti.whatsapp||"")+"'><button class='wa'>📲 WhatsApp</button></a></div><div class='box'><h3>"+t("reviews")+"</h3>"+(x.ti.resenas||[]).map(function(r){return "<div class='stars' style='padding:6px 0'>"+"★".repeat(r.estrellas||5)+" <span style='color:#333'>"+(r.comentario||"")+"</span></div>";}).join("")+"</div>";}
function add(idx){var x=allp()[idx],c=gc(),k=x.s+x.i;c[k]=c[k]||{n:x.p.nombre,p:x.p.precio,q:0,w:x.ti.whatsapp};c[k].q++;sc(c);alert("✅ "+x.p.nombre);}
function cart(){var c=gc(),h="<div class='box'><a class='back' href='#/'>"+t("back")+"</a><h2>"+t("cart")+"</h2>",tot=0,empty=true;
for(var k in c){empty=false;var it=c[k];tot+=it.q*it.p;h+="<div class='row'><span>"+it.n+" ×"+it.q+"</span><span>Rs. "+(it.q*it.p)+" <a href='#' onclick=\"rm('"+k+"')\">✖</a></span></div>";}
if(empty)return h+"<p class='muted'>"+t("empty")+"</p></div>";
return h+"<div class='row'><b>"+t("total")+"</b><b>Rs. "+tot+"</b></div><button onclick=\"go('checkout')\">"+t("checkout")+" →</button></div>";}
function rm(k){var c=gc();delete c[k];sc(c);render();}
var PM="cod";
function checkout(){var c=gc(),tot=0;for(var k in c)tot+=c[k].q*c[k].p;if(!tot)return cart();
return "<div class='box'><a class='back' href='#/cart'>"+t("back")+"</a><h2>"+t("checkout")+"</h2>"+
"<input id='c_name' placeholder='"+t("name")+"'><input id='c_phone' placeholder='"+t("phone")+" (+92…)'><input id='c_addr' placeholder='"+t("addr")+"'><input id='c_city' placeholder='"+t("city")+"'>"+
"<h3 style='margin-top:10px'>"+t("paym")+"</h3><div class='pay'>"+
"<div class='m sel' id='pm_cod' onclick=\"selPM('cod')\">💵 Cash on Delivery</div>"+
"<div class='m' id='pm_jazz' onclick=\"selPM('jazz')\">📱 JazzCash / Easypaisa</div>"+
"<div class='m' id='pm_card' onclick=\"selPM('card')\">💳 Card / PayPal</div>"+
"<div class='m' id='pm_bank' onclick=\"selPM('bank')\">🏦 Bank Transfer</div></div>"+
"<button onclick='placeOrder()'>"+t("place")+" · Rs. "+tot+"</button></div>";}
function selPM(m){PM=m;["cod","jazz","card","bank"].forEach(function(x){document.getElementById("pm_"+x).className="m"+(x===m?" sel":"");});}
function placeOrder(){var nm=document.getElementById("c_name").value,ph=document.getElementById("c_phone").value;
if(!nm||!ph){alert(t("name")+" + "+t("phone"));return;}
var c=gc(),items=[],tot=0,wa="923000000000";for(var k in c){items.push({n:c[k].n,p:c[k].p,q:c[k].q});tot+=c[k].q*c[k].p;wa=c[k].w||wa;}
var oid="NS-"+Math.random().toString(16).slice(2,8).toUpperCase();
var order={id:oid,items:items,total:tot,w:wa,method:PM,customer:{name:nm,phone:ph,addr:document.getElementById("c_addr").value,city:document.getElementById("c_city").value},ref:localStorage.getItem("nx_ref")||"",status:"pending_payment",ts:new Date().toISOString().slice(0,10)};
localStorage.setItem("nx_order_"+oid,JSON.stringify(order));
if(SUPA_KEY){fetch(SUPA_URL+"/rest/v1/orders",{method:"POST",headers:{apikey:SUPA_KEY,Authorization:"Bearer "+SUPA_KEY,"Content-Type":"application/json"},body:JSON.stringify([order])}).catch(function(){});}
localStorage.setItem("nx_cart","{}");bar();go("pay/"+oid);}
function pay(oid){var o=JSON.parse(localStorage.getItem("nx_order_"+oid)||"null");if(!o)return "<div class='box'>Order not found</div>";
var M={cod:"💵 Cash on Delivery — pay the rider when your order arrives.",jazz:"📱 JazzCash / Easypaisa — send Rs. "+o.total+" to the merchant number below, reference: "+oid,card:"💳 Card / PayPal — a secure payment link will be sent to your WhatsApp.",bank:"🏦 Bank Transfer — account details will be sent to your WhatsApp, reference: "+oid};
var txt="Order "+oid+" ("+o.customer.name+", "+o.customer.city+"): "+o.items.map(function(i){return i.q+"x "+i.n;}).join(", ")+" — Rs. "+o.total+" — Method: "+o.method;
return "<div class='box' style='text-align:center'><h2>✅ Order "+oid+"</h2><p class='muted'>"+t("total")+": <b>Rs. "+o.total+"</b></p><p style='margin:10px 0'>"+M[o.method]+"</p><a href='https://wa.me/"+(o.w||"923000000000")+"?text="+encodeURIComponent(txt)+"'><button class='wa'>📲 Confirm by WhatsApp</button></a><button onclick=\"go('track')\">"+t("track")+"</button></div>";}
function track(){return "<div class='box'><h2>📦 "+t("track")+"</h2><input id='t_id' placeholder='"+t("tid")+"'><button onclick='doTrack()'>"+t("track")+"</button><div id='t_out'></div></div>";}
function doTrack(){var o=JSON.parse(localStorage.getItem("nx_order_"+document.getElementById("t_id").value.trim().toUpperCase())||"null");
document.getElementById("t_out").innerHTML=o?"<div class='row'><span>"+o.id+"</span><b>"+o.status+"</b></div><div class='row'><span>"+t("total")+"</span><b>Rs. "+o.total+"</b></div><div class='row'><span>📅</span><span>"+o.ts+"</span></div>":"<p class='muted'>Not found on this device</p>";}
function terms(){return "<div class='box'><h2>Terms & Conditions</h2><p class='muted'>Last updated: Sep 2026</p><p>1. NexusShop is a marketplace platform connecting independent merchants with customers. Each merchant is responsible for their products, prices and fulfillment.</p><p>2. Orders are confirmed via WhatsApp with the merchant. Payment methods include Cash on Delivery, JazzCash/Easypaisa, card/PayPal and bank transfer.</p><p>3. Refunds and returns are handled by each merchant according to their published policy at the time of purchase.</p><p>4. Partner links (?ref=) tag orders for commission purposes only and do not affect prices.</p><p>5. By using NexusShop you accept these terms.</p></div>";}
function privacy(){return "<div class='box'><h2>Privacy Policy</h2><p class='muted'>Last updated: Sep 2026</p><p>1. Your cart and orders are stored locally on your device until you confirm them with the merchant via WhatsApp.</p><p>2. We only collect the data you enter at checkout (name, WhatsApp number, address, city) to process your order.</p><p>3. We do not sell your personal data to third parties.</p><p>4. You can request deletion of your order data at any time by contacting support.</p></div>";}
function render(){var h=location.hash||"#/";var app=document.getElementById("app");
if(h.indexOf("#/store/")===0)app.innerHTML=store(h.slice(8));
else if(h.indexOf("#/p/")===0)app.innerHTML=prod(parseInt(h.slice(4)));
else if(h==="#/cart")app.innerHTML=cart();
else if(h==="#/checkout")app.innerHTML=checkout();
else if(h.indexOf("#/pay/")===0)app.innerHTML=pay(h.slice(6));
else if(h==="#/track")app.innerHTML=track();
else if(h==="#/terms")app.innerHTML=terms();
else if(h==="#/privacy")app.innerHTML=privacy();
else app.innerHTML=home();
bar();window.scrollTo(0,0);}
window.onhashchange=render;render();
</script></body></html>
