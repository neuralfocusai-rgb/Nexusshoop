<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>NexusShop</title>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={darkMode:'media',theme:{extend:{colors:{nx:{50:'#e8f7ee',100:'#c9ecd8',300:'#a3ddb9',500:'#00A650',600:'#008a42',700:'#006d34',900:'#003d1e',yel:'#FFE600',pink:'#EC4899',blue:'#3483FA'}},fontFamily:{sans:['Inter','system-ui','sans-serif'],ur:['Noto Nastaliq Urdu','serif']}}}};
</script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Nastaliq+Urdu:wght@400;700&display=swap" rel="stylesheet">
<style>.ur,.ur *{font-family:'Noto Nastaliq Urdu',serif!important;line-height:2.1}</style>
</head>
<body class="bg-zinc-100 dark:bg-[#0b1512] text-zinc-900 dark:text-zinc-100 font-sans pb-20">
<div id="splash" class="fixed inset-0 z-50 flex flex-col items-center justify-center text-center px-6 bg-gradient-to-b from-nx-500 via-nx-600 to-nx-700 dark:from-[#0b1512] dark:to-[#12281c]">
<style>@keyframes pop{from{transform:scale(.5) rotate(-6deg);opacity:0}to{transform:scale(1);opacity:1}}@keyframes up{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}</style>
<div class="w-24 h-24 rounded-3xl bg-white shadow-2xl flex items-center justify-center text-5xl animate-[pop_.7s_cubic-bezier(.2,.8,.2,1)_both]">🛒</div>
<h1 class="mt-5 text-3xl font-extrabold text-white animate-[up_.6s_.15s_both]">NexusShop</h1>
<p class="mt-3 text-nx-50 animate-[up_.6s_.25s_both]">Your store. Your country. Your income.<br><span class="ur">آپ کی دکان۔ آپ کا ملک۔ آپ کی کمائی۔</span></p>
<div class="mt-5 flex gap-3 animate-[up_.6s_.35s_both]">
<button onclick="setL('en')" class="px-5 py-2 rounded-full bg-white/15 text-white font-bold">English</button>
<button onclick="setL('ur')" class="px-5 py-2 rounded-full bg-white/15 text-white font-bold ur">اردو</button>
</div>
<button onclick="enterShop()" id="sp-enter" class="mt-7 w-full max-w-sm py-4 rounded-2xl bg-white text-nx-700 font-extrabold shadow-lg animate-[up_.6s_.45s_both]">Enter · <span class="ur">داخل کریں</span></button>
</div>
<header class="sticky top-0 z-40 bg-nx-600 dark:bg-[#12281c] text-white shadow">
<div class="max-w-5xl mx-auto flex items-center gap-3 px-4 py-3">
<span class="text-xl">🛒</span><span class="font-extrabold text-lg">NexusShop</span>
<span class="flex-1"></span>
<button onclick="setL(LAN==='ur'?'en':'ur')" id="langbtn" class="px-3 py-1 rounded-full bg-white/15 font-bold text-sm">اردو</button>
<button onclick="location.hash='#/cart'" class="relative px-3 py-1 rounded-full bg-white/15 text-sm">🛒<span id="badge" class="absolute -top-1 -right-1 min-w-[18px] h-[18px] px-1 rounded-full bg-nx-pink text-white text-[10px] font-bold items-center justify-center" style="display:none">0</span></button>
</div>
</header>
<main id="view" class="max-w-5xl mx-auto px-4"></main>
<nav class="fixed bottom-0 inset-x-0 z-40 bg-white dark:bg-[#12281c] border-t border-zinc-200 dark:border-zinc-800 pb-[env(safe-area-inset-bottom)]">
<div class="max-w-5xl mx-auto grid grid-cols-4 text-[11px] font-semibold text-zinc-500 dark:text-zinc-400">
<button onclick="location.hash='#/'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🏠</span><span id="nv-home">Home</span></button>
<button onclick="location.hash='#/offers'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🔥</span><span id="nv-off">Offers</span></button>
<button onclick="location.hash='#/cart'" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">🛒</span><span id="nv-cart">Cart</span></button>
<button onclick="toast(t('coming'))" class="py-2 flex flex-col items-center gap-1"><span class="text-lg">📦</span><span id="nv-ord">Orders</span></button>
</div>
</nav>
<div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-50 px-4 py-2 rounded-full bg-zinc-900/90 text-white text-sm font-semibold" style="display:none"></div>
<script>
var LAN=localStorage.getItem('nx2_lang')||'en';
var T={en:{home:'Home',offers:'Offers',cart:'Cart',orders:'Orders',search:'Search in NexusShop',add:'Add',buy:'Order on WhatsApp',qty:'Quantity',details:'Details',sold:'sold',delivery:'Free delivery tomorrow',cod:'Cash on Delivery',ret:'7-day returns',total:'Total',empty:'Your cart is empty',checkout:'Checkout on WhatsApp',coming:'Coming soon'},
ur:{home:'ہوم',offers:'آفرز',cart:'کارٹ',orders:'آرڈرز',search:'NexusShop میں تلاش',add:'شامل کریں',buy:'واٹس ایپ پر آرڈر',qty:'تعداد',details:'تفصیل',sold:'فروخت شدہ',delivery:'کل مفت ڈیلیوری',cod:'کیش آن ڈیلیوری',ret:'7 دن واپسی',total:'کل',empty:'آپ کا کارٹ خالی ہے',checkout:'واٹس ایپ پر چیک آؤٹ',coming:'جلد آرہا ہے'}};
function t(k){return (T[LAN]&&T[LAN][k])||T.en[k]||k;}
function setL(l){LAN=l;localStorage.setItem('nx2_lang',l);applyL();render();}
function applyL(){document.documentElement.dir=(LAN==='ur')?'rtl':'ltr';document.documentElement.lang=LAN;document.body.classList.toggle('ur',LAN==='ur');var lb=document.getElementById('langbtn');if(lb)lb.textContent=(LAN==='ur'?'EN':'اردو');var nv=[['nv-home','home'],['nv-off','offers'],['nv-cart','cart'],['nv-ord','orders']];for(var i=0;i<nv.length;i++){var e=document.getElementById(nv[i][0]);if(e)e.textContent=t(nv[i][1]);}}
function enterShop(){sessionStorage.setItem('nx2_in','1');var s=document.getElementById('splash');if(s)s.style.display='none';render();}
function money(n){return 'Rs. '+Number(n||0).toLocaleString('en-PK');}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(m){var e=document.getElementById('toast');if(!e)return;e.textContent=m;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(function(){e.style.display='none';},1800);}
var DB={prods:[],stores:[]};
var FALLBACK=[{nombre:'Wireless Earbuds Pro',precio:4999,old:7999,img:'🎧',rating:4.8,sold:412},{nombre:'Smart Watch X2',precio:6499,old:9999,img:'⌚',rating:4.6,sold:287},{nombre:'Power Bank 20000mAh',precio:3999,old:5499,img:'🔋',rating:4.7,sold:198},{nombre:'Bluetooth Speaker Mini',precio:2499,old:3999,img:'🔊',rating:4.5,sold:154}];
fetch('nexus_db.json').then(function(r){return r.json();}).then(function(j){var P=j.prods||j.products||j.items||j.catalog||(Array.isArray(j)?j:[]);if(P&&!Array.isArray(P))P=Object.values(P);var S=j.stores||j.tiendas||j.shops||[];if(S&&!Array.isArray(S))S=Object.values(S);DB.prods=(P&&P.length)?P:FALLBACK;DB.stores=S||[];render();}).catch(function(){DB.prods=FALLBACK;render();});
function P(i){return DB.prods[i];}
function nm(p){return p.nombre||p.name||'Product';}
function pr(p){return p.precio||p.price||0;}
function old(p){return p.old||p.mrp||p.precio_old||0;}
function em(p){return (typeof p.img==='string'&&p.img.length<=4)?p.img:'🛍️';}
function wa(p){return p.whatsapp||p.wa||'924257550650';}
function cart(){try{return JSON.parse(localStorage.getItem('nx2_cart')||'[]');}catch(e){return[];}}
function saveCart(c){localStorage.setItem('nx2_cart',JSON.stringify(c));badge();}
function badge(){var c=cart(),n=0;for(var i=0;i<c.length;i++)n+=c[i].q;var e=document.getElementById('badge');if(!e)return;e.textContent=n;e.style.display=(n>0)?'flex':'none';}
function add(i,q){var c=cart(),f=null;for(var k=0;k<c.length;k++){if(c[k].i===i)f=c[k];}if(f){f.q+=(q||1);}else{c.push({i:i,q:(q||1)});}saveCart(c);toast('✅ '+t('add'));}
function setQ(i,d){var c=cart();for(var k=0;k<c.length;k++){if(c[k].i===i){c[k].q+=d;if(c[k].q<1)c.splice(k,1);}}saveCart(c);render();}
function waLink(p){var msg=(LAN==='ur')?('السلام علیکم! مجھے اس پروڈکٹ میں دلچسپی ہے: '+nm(p)+' ('+money(pr(p))+') — NexusShop'):('Hi! I\'m interested in '+nm(p)+' ('+money(pr(p))+') from NexusShop. Is it available?');return 'https://wa.me/'+wa(p)+'?text='+encodeURIComponent(msg);}
function stars(r){var n=Math.round(r||0),s='';for(var i=1;i<=5;i++)s+=(i<=n?'★':'☆');return '<span class="text-nx-yel text-sm">'+s+'</span>';}
function card(p,i){var d=old(p)?Math.round((1-pr(p)/old(p))*100):0;return '<div onclick="location.hash=\'#/p/'+i+'\'" class="bg-white dark:bg-[#16241d] rounded-xl border border-zinc-200 dark:border-zinc-800 overflow-hidden cursor-pointer active:opacity-80"><div class="relative bg-zinc-50 dark:bg-[#1d2b24] h-32 flex items-center justify-center text-5xl">'+em(p)+(d?'<span class="absolute top-2 left-2 bg-nx-pink text-white text-[10px] font-bold px-2 py-1 rounded-full">-'+d+'%</span>':'')+'</div><div class="p-3"><div class="text-sm font-semibold leading-snug line-clamp-2 min-h-[36px]">'+esc(nm(p))+'</div><div class="mt-1 text-nx-500 font-extrabold">'+money(pr(p))+'</div>'+(old(p)?'<div class="text-xs text-zinc-400 line-through">'+money(old(p))+'</div>':'')+'<div class="mt-1 text-xs text-zinc-500">'+stars(p.rating||p.r)+' · '+(p.sold||p.vendidos||0)+' '+t('sold')+'</div><div class="mt-2 flex items-center justify-between"><span class="text-[10px] font-semibold text-nx-600 dark:text-nx-300">'+t('delivery')+'</span><button onclick="event.stopPropagation();add('+i+',1)" class="bg-nx-500 text-white text-xs font-bold px-3 py-2 rounded-lg">+ '+t('add')+'</button></div></div></div>';}
function home(filter){var h='<div class="mt-4"><input placeholder="'+t('search')+'" class="w-full py-3 px-4 rounded-xl bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 focus:outline-none focus:ring-2 focus:ring-nx-500" oninput="search(this.value)"></div>';
h+='<div class="mt-4 rounded-2xl bg-gradient-to-r from-nx-700 to-nx-500 text-white p-5"><div class="font-extrabold italic text-lg">FLASH SALE · NEXUS FEST −40%</div><div class="text-xs mt-1 opacity-90">'+(LAN==='ur'?'ختم ہونے میں':'Ends in')+'</div><div id="cd" class="mt-1 text-2xl font-extrabold tabular-nums bg-white/15 rounded-lg px-3 py-1 inline-block">--:--:--</div></div>';
var list=DB.prods||[];if(filter==='offers'){list=list.filter(function(p){return old(p)>pr(p);});}
h+='<div class="mt-5 grid grid-cols-2 gap-3" id="grid">';for(var i=0;i<list.length;i++)h+=card(list[i],DB.prods.indexOf(list[i]));h+='</div>';
if(!list.length)h+='<div class="text-center text-zinc-500 py-10">'+(LAN==='ur'?'ابھی کوئی پروڈکٹ نہیں':'No products yet')+'</div>';
return h;}
function search(v){var g=document.getElementById('grid');if(!g)return;v=(v||'').toLowerCase();var out='';for(var i=0;i<DB.prods.length;i++){if(!v||nm(DB.prods[i]).toLowerCase().indexOf(v)>=0)out+=card(DB.prods[i],i);}g.innerHTML=out||'<div class="col-span-2 text-center text-zinc-500 py-10">No results</div>';}
window._q=1;function dq(d){window._q=Math.max(1,Math.min(9,window._q+d));var e=document.getElementById('dq');if(e)e.textContent=window._q;}
function detail(i){var p=P(i);if(!p)return home();var d=old(p)?Math.round((1-pr(p)/old(p))*100):0;var h='<div class="py-4">';
h+='<div class="bg-white dark:bg-[#16241d] rounded-2xl border border-zinc-200 dark:border-zinc-800 p-6 text-center text-7xl">'+em(p)+'</div>';
h+='<div class="mt-3 flex gap-2 justify-center text-2xl"><button class="px-3 py-1 rounded-lg bg-zinc-200 dark:bg-zinc-800">'+em(p)+'</button><button class="px-3 py-1 rounded-lg bg-zinc-200 dark:bg-zinc-800">📦</button><button class="px-3 py-1 rounded-lg bg-zinc-200 dark:bg-zinc-800">✅</button></div>';
h+='<h1 class="mt-4 text-xl font-extrabold">'+esc(nm(p))+'</h1>';
h+='<div class="mt-1 text-sm text-zinc-500">'+stars(p.rating||p.r)+' · '+(p.sold||p.vendidos||0)+' '+t('sold')+'</div>';
h+='<div class="mt-2 text-2xl font-extrabold text-nx-500">'+money(pr(p))+(d?' <span class="align-middle text-xs font-bold bg-nx-pink text-white px-2 py-1 rounded-full">-'+d+'%</span>':'')+'</div>';
if(old(p))h+='<div class="text-sm text-zinc-400 line-through">'+money(old(p))+'</div>';
h+='<div class="mt-3 flex flex-wrap gap-2"><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('cod')+'</span><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('delivery')+'</span><span class="text-[11px] font-bold px-3 py-1 rounded-full bg-zinc-200 dark:bg-zinc-800">'+t('ret')+'</span></div>';
h+='<div class="mt-4 flex items-center gap-3"><span class="text-sm font-semibold">'+t('qty')+'</span><button onclick="dq(-1)" class="w-9 h-9 rounded-lg bg-nx-500 text-white font-extrabold">−</button><span id="dq" class="w-7 text-center font-extrabold">1</span><button onclick="dq(1)" class="w-9 h-9 rounded-lg bg-nx-500 text-white font-extrabold">+</button></div>';
h+='<div class="mt-5 flex gap-3"><a href="'+waLink(p)+'" target="_blank" rel="noopener" class="flex-[1.2] text-center py-3 rounded-xl bg-[#25D366] text-white font-extrabold">💬 '+t('buy')+'</a><button onclick="add('+i+',window._q||1)" class="flex-1 py-3 rounded-xl bg-nx-500 text-white font-extrabold">'+t('add')+' 🛒</button></div>';
var de=p.desc||p.description||'';if(de){h+='<div class="mt-5 text-sm font-extrabold">'+t('details')+'</div><div class="mt-1 text-sm text-zinc-600 dark:text-zinc-300 bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 rounded-xl p-3">'+esc(de)+'</div>';}
h+='</div>';return h;}
function cartView(){var c=cart();if(!c.length)return '<div class="py-16 text-center text-zinc-500">'+t('empty')+'</div>';var h='<div class="py-4">';var tot=0;
for(var k=0;k<c.length;k++){var p=P(c[k].i);if(!p)continue;tot+=pr(p)*c[k].q;h+='<div class="flex items-center gap-3 bg-white dark:bg-[#16241d] border border-zinc-200 dark:border-zinc-800 rounded-xl p-3 mb-2"><div class="text-3xl">'+em(p)+'</div><div class="flex-1"><div class="text-sm font-semibold">'+esc(nm(p))+'</div><div class="text-nx-500 font-bold text-sm">'+money(pr(p))+'</div></div><div class="flex items-center gap-2"><button onclick="setQ('+c[k].i+',-1)" class="w-8 h-8 rounded-lg bg-zinc-200 dark:bg-zinc-800 font-bold">−</button><span class="w-6 text-center font-bold">'+c[k].q+'</span><button onclick="setQ('+c[k].i+',1)" class="w-8 h-8 rounded-lg bg-nx-500 text-white font-bold">+</button></div></div>';}
var msg=(LAN==='ur')?('السلام علیکم! میں NexusShop پر آرڈر کرنا چاہتا ہوں۔ کل: '+money(tot)):('Hi! I\'d like to place an order on NexusShop. Total: '+money(tot));
h+='<div class="mt-4 flex items-center justify-between text-lg font-extrabold"><span>'+t('total')+'</span><span class="text-nx-500">'+money(tot)+'</span></div>';
h+='<a href="https://wa.me/924257550650?text='+encodeURIComponent(msg)+'" target="_blank" rel="noopener" class="mt-4 block text-center py-4 rounded-xl bg-[#25D366] text-white font-extrabold">💬 '+t('checkout')+'</a></div>';return h;}
function tick(){var e=document.getElementById('cd');if(!e)return;var now=new Date(),end=new Date();end.setHours(23,59,59,999);var s=Math.max(0,Math.floor((end-now)/1000));var hh=Math.floor(s/3600),mm=Math.floor(s%3600/60),ss=s%60;e.textContent=(hh<10?'0':'')+hh+':'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss;}
setInterval(tick,1000);
function render(){var v=document.getElementById('view');if(!v)return;var h=location.hash||'#/';applyL();badge();
if(h.indexOf('#/p/')===0){v.innerHTML=detail(parseInt(h.slice(4),10)||h.slice(4));}
else if(h==='#/cart'){v.innerHTML=cartView();}
else if(h==='#/offers'){v.innerHTML=home('offers');}
else{v.innerHTML=home();}
tick();}
window.onhashchange=render;
if(sessionStorage.getItem('nx2_in')){var s=document.getElementById('splash');if(s)s.style.display='none';}
applyL();render();
</script>
</body>
</html>
